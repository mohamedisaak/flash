[project]
name = "flash-backend"
version = "0.1.0"
description = "Flash — news publishing platform backend (Django + DRF modular monolith)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "pillow>=11.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "celery[redis]>=5.4",
]

[dependency-groups]
# Installed in dev/CI only (uv sync installs these by default).
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
]

# Optional: S3/MinIO-compatible object storage for media in production.
# Enable with `uv sync --extra s3` and set USE_S3=True (see .env.example).
[project.optional-dependencies]
s3 = [
    "django-storages>=1.14",
    "boto3>=1.35",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
